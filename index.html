<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C7BDC">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<title>PLP: Paga la Pichanga</title>
<script>
/* =================== CONFIGURACIÓN =================== */
// Pega aquí la URL de tu Apps Script (termina en /exec).
// Si queda vacía, la app funciona en MODO DEMO (datos de prueba en este celular).
const API_URL = 'https://script.google.com/macros/s/AKfycbyhMwBAQRYdclzwHsSb0PMZvr1td2sMbMxDQcZnc4u-7JULIacdLWkr6vVmhffIw0iv/exec';
const MONEDA = { locale: 'es-CL', currency: 'CLP' };   // Argentina: es-AR / ARS · México: es-MX / MXN
const CODIGO_PAIS = '56';                              // para links de WhatsApp (Chile 56, Argentina 549…)
/* ===================================================== */
</script>
<style>
/* Colores: 3 paletas (Perfil → Colores). --bg fondo · --pri color del tema · --priInk versión legible
   del tema para texto sobre blanco · --onPri texto sobre el tema · --bgInk texto directo sobre el fondo. */
:root{
  color-scheme:light;
  --card:#fff;--field:#f3f4f6;--ink:#16202a;--mute:#5f6b76;--line:#e1e5ea;
  --bg:#FFC20A;--bgInk:#3d2e00;--pri:#0C7BDC;--pri2:#0A5FAD;--priInk:#0A69BC;--priSoft:#e3f0fc;--onPri:#fff;
  --red:#c62828;--redSoft:#fdecec;--blue:#1c5cb8;--blueSoft:#e8f0fc;--amber:#9a5b00;--amberSoft:#fff3dc;
  --r:18px;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.08);
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
}
:root[data-pal="2"]{--bg:#E1BE6A;--bgInk:#3b2a06;--pri:#40B0A6;--pri2:#2F8C83;--priInk:#2A7A73;--priSoft:#ddf2f0;--onPri:#10231f}
:root[data-pal="3"]{--bg:#DCDCDC;--bgInk:#2b2f33;--pri:#1A85FF;--pri2:#0F64C8;--priInk:#0F6AD6;--priSoft:#e2eeff;--onPri:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.splash{min-height:100vh;display:grid;place-items:center;color:var(--mute)}
/* barra superior */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onPri);
  padding:calc(12px + var(--safeT)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ic{background:rgba(255,255,255,.15);border:0;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--mute);vertical-align:middle}
.top .tag{background:#ffd54a;color:#4a3500}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:#ffd54a;z-index:50;transition:width .3s}
body.busy #bar{width:85%;transition:width 6s cubic-bezier(.1,.7,.2,1)}
body.busy .btn{pointer-events:none;opacity:.7}
main{padding:14px 14px calc(96px + var(--safeB));max-width:640px;margin:0 auto}
/* navegación inferior */
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + var(--safeB))}
nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:12px;color:var(--mute);cursor:pointer;position:relative}
nav button .e{font-size:22px;line-height:1;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--priInk);font-weight:700}
nav button.on .e{filter:none;opacity:1}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}
/* tarjetas */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--bgInk);font-weight:750;margin:22px 4px 8px}
.card .sec,#modal .sec{color:var(--mute);font-weight:400}
main>p.mute,.login>p.mute,.brand p.mute{color:var(--bgInk);opacity:.9}
.mute{color:var(--mute)}.small{font-size:13px}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.chip.g{background:var(--priSoft);border-color:transparent;color:var(--priInk);font-weight:600}
/* botones */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--field);border:1px solid var(--line)}
.btn.pri{background:var(--pri);color:var(--onPri);border-color:var(--pri)}
.btn.big{padding:16px;font-size:18px}
.btn.full{width:100%}
.btn.red{background:var(--redSoft);color:var(--red);border-color:transparent}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:11px}
.btn.link{background:none;border:0;color:var(--priInk);padding:6px}
.btns{display:flex;gap:8px;margin-top:12px}.btns .btn{flex:1}
/* partido */
.pt-day{font-size:22px;font-weight:800;letter-spacing:-.01em}
.pt-when{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--priInk)}
.meter{height:10px;background:var(--field);border-radius:99px;overflow:hidden;margin:6px 0 2px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--pri);border-radius:99px}
.status{border-radius:14px;padding:10px 12px;margin:12px 0;font-weight:600}
.status.ok{background:var(--priSoft)}.status.warn{background:var(--amberSoft);color:var(--amber)}.status.bad{background:var(--redSoft);color:var(--red)}
ol.roster{margin:8px 0 0;padding:0;list-style:none;counter-reset:n;columns:2;column-gap:14px}
ol.roster li{counter-increment:n;padding:6px 0;border-bottom:1px dashed var(--line);break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.roster li::before{content:counter(n) ".";display:inline-block;width:26px;color:var(--mute);font-variant-numeric:tabular-nums}
ol.roster li.me{font-weight:700;color:var(--priInk)}
ol.roster li.free{color:var(--mute);font-style:italic}
ol.roster li.x{text-decoration:line-through;color:var(--mute)}
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:14px}
details summary{cursor:pointer;color:var(--mute);font-weight:600;padding:6px 0}
/* listas */
.list{padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li .t{font-weight:600}
.amt{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--red)}.amt.pos{color:var(--priInk)}.amt.inf{color:var(--blue)}
.amt.strike{text-decoration:line-through;color:var(--mute)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:4px}
.pill.pend{background:var(--amberSoft);color:var(--amber)}.pill.rech,.pill.anul{background:var(--redSoft);color:var(--red)}
/* saldo */
.hero{border-radius:22px;padding:22px;text-align:center;margin-bottom:14px}
.hero .lbl{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.hero .big{font-size:42px;font-weight:850;letter-spacing:-.02em;margin:4px 0}
.hero.bad{background:var(--redSoft);color:var(--red)}.hero.ok{background:var(--priSoft);color:var(--priInk)}.hero.inf{background:var(--blueSoft);color:var(--blue)}
pre.datos{white-space:pre-wrap;font:inherit;margin:8px 0;background:var(--field);padding:12px;border-radius:12px}
/* formularios */
label{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:12px 0 0}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.tel{display:flex;margin-top:6px}
.tel span{display:grid;place-items:center;padding:0 12px;background:var(--line);border:1px solid var(--line);border-radius:12px 0 0 12px;font-weight:700;color:var(--ink)}
.tel input{margin:0;border-radius:0 12px 12px 0}
.install{display:flex;align-items:center;gap:12px;background:var(--priSoft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.install .e{font-size:28px}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--pri);flex:none}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:6px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer;font-size:15px;position:relative}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg .badge{top:-4px;left:auto;right:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.prev img{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:block}
/* login */
.login{max-width:420px;margin:0 auto;padding:calc(40px + var(--safeT)) 18px 40px}
.brand{text-align:center;margin-bottom:20px;color:var(--bgInk)}
.logo{display:block;margin:0 auto;width:min(260px,72vw);height:auto;background:#fff;border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.brand h1{font-size:28px;margin-top:12px;letter-spacing:-.02em}
.top .mini{width:34px;height:34px;border-radius:9px;background:#fff;object-fit:contain;padding:2px;flex:none}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pal{border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--card);cursor:pointer;text-align:center;font-size:13px;font-weight:650}
.pal.on{border-color:var(--ink)}
.pal i{display:block;height:44px;border-radius:9px;margin-bottom:5px;position:relative}
.pal i b{position:absolute;left:18%;right:18%;bottom:8px;height:14px;border-radius:7px}
.demo{background:var(--amberSoft);color:var(--amber);border-radius:var(--r);padding:14px;margin-top:14px;font-size:14px}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none}
#modal.on{display:block}
#modal .bg{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:8px 18px calc(24px + var(--safeB));max-width:640px;margin:0 auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
#modal .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
#modal h2{font-size:21px;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safeB));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;
  background:#1d2a22;color:#fff;padding:12px 18px;border-radius:14px;max-width:90vw;font-weight:600;transition:.25s;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--red)}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}
.empty .e{font-size:44px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"><div class="splash">Cargando…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
 *  PLP: PAGA LA PICHANGA · App
 * ===================================================================== */
const DEMO = !API_URL || /[?&]demo\b/.test(location.search);
const TK = DEMO ? 'plp_demo_token' : 'plc_token';   // 'plc_token': así nadie pierde su sesión con el cambio de nombre
const S = { token: localStorage.getItem(TK) || '', d: null, tab: 'partidos', adm: 'pagos', lastLoad: 0 };
const A = {};          // acciones llamadas desde onclick
let FILE = null;       // comprobante elegido en el formulario abierto
let installEvt = null;
let loginMode = 'in';

const APP = 'PLP: Paga la Pichanga';
const LOGO = `<img class="logo" src="logo.png" alt="PLP · Paga la Pichanga">`;

/* ---------- paletas de color (se guardan en este celular) ---------- */
const PALETAS = {
  1: { nombre: 'Amarillo', bg: '#FFC20A', pri: '#0C7BDC' },
  2: { nombre: 'Arena', bg: '#E1BE6A', pri: '#40B0A6' },
  3: { nombre: 'Gris', bg: '#DCDCDC', pri: '#1A85FF' }
};
function aplicarPaleta(n) {
  n = PALETAS[n] ? String(n) : '1';
  document.documentElement.dataset.pal = n;
  document.querySelector('meta[name=theme-color]').setAttribute('content', PALETAS[n].pri);
  return n;
}
let PAL = aplicarPaleta(localStorage.getItem('plp_paleta'));
A.paleta = n => { PAL = aplicarPaleta(n); localStorage.setItem('plp_paleta', PAL); render(); };

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtMoney = new Intl.NumberFormat(MONEDA.locale, { style: 'currency', currency: MONEDA.currency, maximumFractionDigits: 0 });
const money = n => fmtMoney.format(Math.round(n || 0));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const dParse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = dParse(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fechaLarga = s => cap(dParse(s).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }));
const fechaCorta = s => cap(dParse(s).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }));
const fechaHora = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('es', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); };
const isAdmin = () => S.d && S.d.me.rol === 'admin';
// Pesos enteros: "5.000", "5,000" y "$5000" = 5000 (igual que el servidor).
const entero = s => Number(String(s == null ? '' : s).replace(/\D/g, '')) || 0;
// Precio por jugador = costo ÷ dividirEntre, redondeado hacia arriba al múltiplo de "redondeo" (igual que el servidor).
const precioDe = (costo, cfg) => { cfg = cfg || S.d.config; const div = Math.max(1, cfg.dividirEntre), red = Math.max(1, cfg.redondeo || 1); return Math.ceil(entero(costo) / (div * red)) * red; };
/** "12 × $5.900 = $70.800 · sobran $800 de la cancha" */
function cuentaCancha(n, precio, costo) {
  const total = n * precio, dif = total - costo;
  return `${n} × ${money(precio)} = <b>${money(total)}</b>` + (costo > 0 ? ` · cancha ${money(costo)}` +
    (dif < 0 ? ` · <span class="amt neg">faltan ${money(-dif)}</span>` : dif > 0 ? ` · sobran ${money(dif)}` : ' · justo ✅') : '');
}
const inputMonto = (id, v, extra) => `<input id="${id}" type="text" inputmode="numeric" autocomplete="off" value="${v || ''}" placeholder="0" ${extra || ''}>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cuando(f) {
  if (f === S.d.hoy) return 'Hoy';
  if (f === addDays(S.d.hoy, 1)) return 'Mañana';
  const n = Math.round((dParse(f) - dParse(S.d.hoy)) / 864e5);
  return n > 1 && n < 7 ? 'En ' + n + ' días' : n < 0 ? 'Ya jugado' : '';
}
function waTel(t) { t = String(t || '').replace(/\D/g, ''); return t.length <= 9 ? CODIGO_PAIS + t : t; }
function wa(text, tel) { return 'https://wa.me/' + (tel ? waTel(tel) : '') + '?text=' + encodeURIComponent(text); }
function appUrl() { return location.origin + location.pathname.replace(/index\.html$/, ''); }

let toastT;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'on' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', kind === 'err' ? 4200 : 2800);
}
let busyN = 0;
function setBusy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); document.body.classList.toggle('busy', busyN > 0); }

/* ---------- servidor ---------- */
async function call(action, args) {
  const req = { action, token: S.token, args: args || {} };
  let r;
  if (DEMO) {
    await sleep(120);
    DEMO_STORE.refresh();   // por si hay otra pestaña con el demo abierto
    r = JSON.parse(JSON.stringify(api_(JSON.parse(JSON.stringify(req)))));
  } else {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) });
    } catch (e) { throw new Error('Sin conexión. Revisa tu internet.'); }
    const txt = await res.text();
    try { r = JSON.parse(txt); } catch (e) { throw new Error('El servidor no respondió bien. Intenta de nuevo.'); }
  }
  if (!r.ok) {
    if (r.code === 'auth') { setToken(''); S.d = null; render(); }
    throw new Error(r.error || 'Error');
  }
  return r;
}
function setToken(t) { S.token = t; if (t) localStorage.setItem(TK, t); else localStorage.removeItem(TK); }

async function load(quiet) {
  if (!S.token) return render();
  setBusy(true);
  try { S.d = await call('estado'); S.lastLoad = Date.now(); }
  catch (e) { if (!quiet) toast(e.message, 'err'); }
  finally { setBusy(false); render(); }
}
/** Ejecuta una acción con indicador de carga y manejo de errores. */
async function run(fn) {
  if (busyN > 0) return;
  setBusy(true);
  try { return await fn(); }
  catch (e) { toast(e.message || 'Error', 'err'); }
  finally { setBusy(false); }
}
/** Llama al servidor, muestra el mensaje, recarga datos. */
function act(action, args, after) {
  return run(async () => {
    const r = await call(action, args);
    if (r.mensaje) toast(r.mensaje);
    closeModal();
    await load(true);
    if (after) after(r);
    return r;
  });
}

/* ---------- modal ---------- */
function modal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="bg" onclick="closeModal()"></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  m.className = 'on';
}
function closeModal() { const m = $('#modal'); m.className = ''; m.innerHTML = ''; FILE = null; }
function ask(title, text, ok, danger) {
  return new Promise(res => {
    A._ask = v => { closeModal(); res(v); };
    modal(`<h2>${esc(title)}</h2><p class="mute">${text}</p>
      <div class="btns"><button class="btn" onclick="A._ask(false)">Volver</button>
      <button class="btn ${danger ? 'red' : 'pri'}" onclick="A._ask(true)">${esc(ok)}</button></div>`);
  });
}
A.seg = el => { [...el.parentNode.children].forEach(b => b.classList.toggle('on', b === el)); if (el.dataset.on) A[el.dataset.on](el.dataset.v); };
const segVal = id => { const b = document.querySelector('#' + id + ' button.on'); return b ? b.dataset.v : ''; };

/* ---------- comprobantes ---------- */
async function leerArchivo(f) {
  if (f.type === 'application/pdf') {
    if (f.size > 3e6) throw new Error('El PDF es muy grande (máx. 3 MB)');
    const b64 = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(f); });
    return { name: f.name, mime: f.type, b64, pdf: true };
  }
  if (!/^image\//.test(f.type)) throw new Error('Adjunta una foto o PDF');
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se pudo leer la imagen')); i.src = url; });
    const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.75);
    return { name: 'comprobante.jpg', mime: 'image/jpeg', b64: data.split(',')[1], url: data };
  } finally { URL.revokeObjectURL(url); }
}
A.file = async input => {
  FILE = null;
  const prev = document.getElementById('f_prev');
  const f = input.files && input.files[0];
  if (!f) { prev.innerHTML = ''; return; }
  prev.innerHTML = '<p class="mute small">Procesando…</p>';

    FILE = await leerArchivo(f);
    prev.innerHTML = FILE.pdf ? `<p class="small">📄 ${esc(FILE.name)}</p>` : `<img src="${FILE.url}" alt="comprobante">`;
  } catch (e) { prev.innerHTML = ''; input.value = ''; toast(e.message, 'err'); }
};
function campoArchivo(label) {
  return `<label>${label}<input type="file" accept="image/*,application/pdf" onchange="A.file(this)"></label><div id="f_prev" class="prev"></div>`;
}
const archivoArg = () => FILE ? { name: FILE.name, mime: FILE.mime, b64: FILE.b64 } : null;
A.verComp = id => run(async () => {
  const r = await call('verComprobante', { id });
  if (/pdf/.test(r.mime)) {
    const bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: r.mime }));
    modal(`<h2>Comprobante</h2><p><a class="btn pri full" style="display:block;text-align:center;text-decoration:none" href="${url}" target="_blank" download="comprobante.pdf">📄 Abrir PDF</a></p>`);

    <div class="chips"><span class="chip g">${money(p.precio)} por jugador</span><span class="chip">${tit.length}/${p.cupo} anotados</span>${esp.length ? `<span class="chip">${esp.length} en espera</span>` : ''}</div>
    <div class="meter"><i style="width:${Math.min(100, tit.length / p.cupo * 100)}%"></i></div>
    <div class="small mute">${lleno ? 'Cupos completos' : 'Quedan ' + libres + ' cupo' + (libres === 1 ? '' : 's')}</div>
    ${status}
    <div style="margin-top:12px">${accion}</div>
    <div class="sub">Titulares</div>
    <ol class="roster">${tit.map(i => li(i)).join('')}${'<li class="free">libre</li>'.repeat(libres)}</ol>

    ${tarde.length ? `<div class="sub">Cancelaron el mismo día (pagan igual)</div><ol class="roster">${tarde.map(i => li(i, 'x')).join('')}</ol>` : ''}
    ${p.datosTransferencia ? `<details style="margin-top:10px"><summary>🏦 Datos para transferir</summary><pre class="datos">${esc(p.datosTransferencia)}</pre>
      <button class="btn sm" onclick="A.copiar(partidoById('${p.id}').datosTransferencia)">📋 Copiar datos</button></details>` : ''}
    <div class="btns"><button class="btn sm" onclick="A.compartir('${p.id}')">📲 Compartir lista</button>

  </div>`;

/** Datos para transferir que le sirven al jugador: los de los partidos que tiene cobrados
 *  (agrupados si se repiten). Si ningún partido tiene datos, los generales de Ajustes. */
function datosParaMi() {
  const grupos = [];
  const cobrados = S.d.misMovimientos.filter(m => m.tipo === 'cargo' && m.estado === 'confirmado' && m.partidoId)
    .map(m => partidoById(m.partidoId)).filter(p => p && p.datosTransferencia).sort((a, b) => asc(b, a));
  cobrados.forEach(p => {
    const g = grupos.find(x => x.texto === p.datosTransferencia);
    if (g) g.partidos.push(p); else grupos.push({ texto: p.datosTransferencia, partidos: [p] });
  });
  if (!grupos.length && S.d.config.datosTransferencia) grupos.push({ texto: S.d.config.datosTransferencia, partidos: [] });
  return grupos;
}
function viewCuenta() {

A.salir = async () => {

  setToken(''); S.d = null; render();
};
A.instalar = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); };
A.resetDemo = async () => {
  if (!await ask('¿Reiniciar demo?', 'Se borran los datos de prueba y vuelven los de ejemplo.', 'Reiniciar', true)) return;

      <div class="small mute" style="margin-top:6px">Deuda actual: ${money((jugadorById(m.jugadorId) || {}).deuda)}</div>
      <div class="btns">${m.comprobante ? `<button class="btn" onclick="A.verComp('${m.id}')">📎 Ver</button>` : '<span class="small mute" style="align-self:center">Sin comprobante</span>'}
      <button class="btn red" onclick="A.rechazar('${m.id}')">Rechazar</button><button class="btn pri" onclick="A.aprobar('${m.id}')">Aprobar</button></div></div>`).join('');

A.aprobar = id => act('revisarPago', { id, aprobar: true });
A.rechazar = id => modal(`<h2>Rechazar pago</h2><label>Motivo (opcional, lo verá el jugador)<input id="r_mot" maxlength="100" placeholder="Ej: no llegó la transferencia"></label>
  <div class="btns"><button class="btn" onclick="closeModal()">Volver</button><button class="btn red" onclick="act('revisarPago',{id:'${id}',aprobar:false,motivo:val('r_mot')})">Rechazar</button></div>`);

function admJugadores() {
  const js = S.d.jugadores.slice().sort((a, b) => (b.activo === 'si') - (a.activo === 'si') || b.deuda - a.deuda || a.nombre.localeCompare(b.nombre));

    <input placeholder="🔎 Buscar jugador" oninput="A.filtrar(this.value)">
    <div class="card list" style="margin-top:10px">${js.map(j => `<div class="li tap" data-n="${esc(j.nombre.toLowerCase())}" onclick="A.jugador('${j.id}')">

A.nuevoJugador = () => modal(`<h2>Agregar jugador</h2>

  <label>Nombre<input id="j_nombre" maxlength="40" autocomplete="off" placeholder="Como lo conocen en el grupo"></label>

A.filtrar = q => { q = q.toLowerCase(); document.querySelectorAll('[data-n]').forEach(e => e.style.display = e.dataset.n.includes(q) ? '' : 'none'); };
A.compartirDeudas = () => {
  const L = S.d.jugadores.filter(j => j.deuda > 0).sort((a, b) => b.deuda - a.deuda);

A.jugador = id => {

    <div class="btns"><button class="btn pri" onclick="A.movAdmin('${id}','pago')">💵 Registrar pago</button><button class="btn" onclick="A.movAdmin('${id}','cargo')">➕ Cargo</button></div>

    <h3 class="sec">Movimientos</h3><div class="list" style="padding:0">${movs.length ? movs.map(m => rowMov(m, true)).join('') : '<p class="mute">Sin movimientos.</p>'}</div>

      <label>Nombre<input id="e_nombre" maxlength="40" value="${esc(j.nombre)}"></label>

      <button class="btn sm red" style="margin-top:10px" onclick="act('editarJugador',{id:'${id}',activo:${j.activo === 'si' ? 'false' : 'true'}})">${j.activo === 'si' ? 'Desactivar cuenta' : 'Activar cuenta'}</button>
      </details>`}`);
};
A.movAdmin = (id, tipo) => {
  const j = jugadorById(id);

    <label>Monto${inputMonto('m_monto', tipo === 'pago' && j.deuda > 0 ? j.deuda : '')}</label>
    ${tipo === 'pago' ? `<label>Método</label><div class="seg" id="m_met"><button class="on" data-v="efectivo" onclick="A.seg(this)">💵 Efectivo</button><button data-v="transferencia" onclick="A.seg(this)">🏦 Transferencia</button></div>
      ${campoArchivo('Comprobante (opcional)')}` : ''}
    <label>${tipo === 'cargo' ? 'Motivo' : 'Nota (opcional)'}<input id="m_nota" maxlength="200" placeholder="${tipo === 'cargo' ? 'Ej: Saldo inicial, deuda anterior…' : ''}"></label>
    <button class="btn pri full big" style="margin-top:16px" onclick="A.guardarMov('${id}','${tipo}')">Guardar</button>`);
};
A.guardarMov = (id, tipo) => act('registrarMovimiento', {
  jugadorId: id, tipo, monto: val('m_monto'), metodo: tipo === 'pago' ? segVal('m_met') : '', nota: val('m_nota'), archivo: archivoArg()
}, () => A.jugador(id));
A.anular = async (mid, jid) => {
  if (!await ask('¿Anular movimiento?', 'Dejará de contar en el saldo. Queda registrado como anulado.', 'Anular', true)) return;
  act('anularMovimiento', { id: mid }, () => jid && isAdmin() && A.jugador(jid));
};

/* ---------- partidos (admin) ---------- */
function admPartidos() {
  const abiertos = S.d.partidos.filter(p => p.estado === 'abierto').sort(asc);
  const cerrados = S.d.partidos.filter(p => p.estado !== 'abierto').sort((a, b) => asc(b, a));
  return `<button class="btn pri full big" onclick="A.nuevoPartido()">➕ Nuevo partido</button>
    <h3 class="sec">Abiertos</h3>
    ${abiertos.length ? `<div class="card list">${abiertos.map(p => {
      const n = insOf(p.id).filter(i => i.estado === 'titular').length;
      return `<div class="li tap" onclick="A.gestionar('${p.id}')"><div class="grow"><div class="t">${fechaCorta(p.fecha)} · ${esc(p.hora)}
        ${empezo(p) ? '<span class="pill pend">por cerrar</span>' : ''}</div><div class="small mute">${n}/${p.cupo} · ${money(p.precio)} c/u</div></div><span class="mute">›</span></div>`;
    }).join('')}</div>` : '<p class="mute center">No hay partidos abiertos.</p>'}
    <p class="small mute">El precio se carga a cada jugador cuando se anota. Puedes editar el partido hasta cerrarlo.
      Después de jugar, entra al partido y toca <b>“Cerrar partido”</b> para confirmar quién paga.</p>
    ${cerrados.length ? `<h3 class="sec">Cerrados y suspendidos</h3><div class="card list">${cerrados.map(p => `<div class="li tap" onclick="A.gestionar('${p.id}')">
      <div class="grow"><div class="t">${fechaCorta(p.fecha)} · ${esc(p.hora)} <span class="pill ${p.estado === 'cerrado' ? '' : 'anul'}">${p.estado}</span></div>
      <div class="small mute">${p.datosTransferencia ? '🏦 Con datos para transferir' : 'Sin datos para transferir'}</div></div><span class="mute">›</span></div>`).join('')}</div>` : ''}`;
}
function formPartido(p) {
  const c = S.d.config;
  return `<div class="grid2"><label>Fecha<input id="n_fecha" type="date" value="${p.fecha}"></label>
      <label>Hora<input id="n_hora" type="time" value="${esc(p.hora)}"></label></div>
    <label>Lugar<input id="n_lugar" maxlength="80" value="${esc(p.lugar || '')}" placeholder="Ej: Cancha 2"></label>
    <div class="grid2"><label>Costo cancha${inputMonto('n_costo', p.costoTotal, 'oninput="A.calcPrecio()"')}</label>
      <label>Cupo<input id="n_cupo" type="text" inputmode="numeric" value="${p.cupo}" oninput="A.hintPrecio()"></label></div>
    <label>Precio por jugador <span class="small">(costo ÷ ${c.dividirEntre}, redondeado a $${c.redondeo})</span>${inputMonto('n_precio', p.precio, 'oninput="A.hintPrecio()"')}</label>
    <p class="small mute" id="n_hint" style="margin:6px 0 0"></p>
    <label>Nota (opcional)<input id="n_nota" maxlength="200" value="${esc(p.nota || '')}" placeholder="Ej: traer camiseta blanca y oscura"></label>
    ${campoDatos('n_datos', p.datosTransferencia)}`;
}
const campoDatos = (id, v) => `<label>Datos para transferir <span class="small">(de este partido)</span><textarea id="${id}" rows="5" maxlength="500"
  placeholder="Banco, tipo y número de cuenta, RUT, nombre, correo">${esc(v || '')}</textarea></label>`;
A.calcPrecio = () => { const c = entero(val('n_costo')); if (c > 0) document.getElementById('n_precio').value = precioDe(c); A.hintPrecio(); };
A.hintPrecio = () => {
  const h = document.getElementById('n_hint'); if (!h) return;
  const cupo = entero(val('n_cupo')), precio = entero(val('n_precio')), costo = entero(val('n_costo'));
  h.innerHTML = cupo && precio ? 'Si juegan ' + cupo + ': ' + cuentaCancha(cupo, precio, costo) : '';
};
const datosForm = () => ({ fecha: val('n_fecha'), hora: val('n_hora'), lugar: val('n_lugar'), costoTotal: val('n_costo'), cupo: val('n_cupo'),
  precio: val('n_precio'), nota: val('n_nota'), datosTransferencia: val('n_datos') });
A.nuevoPartido = () => {
  const c = S.d.config;
  const ult = S.d.partidos.slice().sort(asc).pop();
  let fecha = ult ? addDays(ult.fecha, 7) : S.d.hoy;
  while (fecha < S.d.hoy) fecha = addDays(fecha, 7);
  const base = { fecha, hora: ult ? ult.hora : c.hora, lugar: ult ? ult.lugar : c.lugar, costoTotal: c.costoCancha, cupo: c.cupo,
    precio: precioDe(c.costoCancha), datosTransferencia: c.datosTransferencia };
  modal(`<h2>Nuevo partido</h2>${formPartido(base)}
    <button class="btn pri full big" style="margin-top:16px" onclick="act('crearPartido', datosForm())">Crear partido</button>`);
  A.hintPrecio();
};
A.gestionar = pid => {
  const p = partidoById(pid);
  if (!p) return;
  if (p.estado !== 'abierto') return A.gestionarCerrado(pid);
  const L = insOf(pid);
  const activos = L.filter(i => i.estado === 'titular' || i.estado === 'espera');
  const libres = S.d.jugadores.filter(j => j.activo === 'si' && !activos.some(i => i.jugadorId === j.id)).sort((a, b) => a.nombre.localeCompare(b.nombre));
  const etq = { titular: '', espera: '<span class="pill pend">espera</span>', cancelado_tarde: '<span class="pill rech">canceló hoy</span>', cancelado: '<span class="pill">canceló</span>' };
  modal(`<h2>${fechaLarga(p.fecha)} · ${esc(p.hora)}</h2><p class="mute">${activos.filter(i => i.estado === 'titular').length}/${p.cupo} titulares · ${money(p.precio)} c/u</p>
    <div class="btns" style="margin-top:4px"><button class="btn" onclick="A.editarPartido('${pid}')">✏️ Editar partido</button>
      <button class="btn pri" onclick="A.cerrar('${pid}')">✅ Cerrar partido</button></div>
    <h3 class="sec">Inscritos</h3><div class="list" style="padding:0">${L.length ? L.map(i => `<div class="li"><div class="grow">${esc(i.nombre)} ${etq[i.estado]}</div>
      ${i.estado === 'titular' || i.estado === 'espera' ? `<button class="btn sm" onclick="act('adminQuitar',{partidoId:'${pid}',jugadorId:'${i.jugadorId}'},()=>A.gestionar('${pid}'))">Quitar</button>` : ''}</div>`).join('') : '<p class="mute">Nadie anotado todavía.</p>'}</div>
    ${libres.length ? `<label>Anotar a un jugador</label><div class="row"><select id="g_add" class="grow">${libres.map(j => `<option value="${j.id}">${esc(j.nombre)}</option>`).join('')}</select>
      <button class="btn" style="margin-top:6px" onclick="act('adminInscribir',{partidoId:'${pid}',jugadorId:val('g_add')},()=>A.gestionar('${pid}'))">Anotar</button></div>` : ''}
    <button class="btn red full" style="margin-top:14px" onclick="A.suspender('${pid}')">🚫 Suspender partido</button>`);
};
/** Editar todos los datos del partido (mientras no esté cerrado). */
A.editarPartido = pid => {
  const p = partidoById(pid);
  modal(`<h2>Editar partido</h2><p class="mute small">Si cambias el precio, se actualiza el cobro de todos los anotados.</p>${formPartido(p)}
    <div class="btns" style="margin-top:16px"><button class="btn" onclick="A.gestionar('${pid}')">Volver</button>
      <button class="btn pri" onclick="act('editarPartido', Object.assign({id:'${pid}'}, datosForm()), ()=>A.gestionar('${pid}'))">Guardar cambios</button></div>`);
  A.hintPrecio();
};
/** Partido cerrado o suspendido: sólo se cambian sus datos para transferir. */
A.gestionarCerrado = pid => {
  const p = partidoById(pid);
  const n = insOf(pid).filter(i => i.estado === 'titular' || i.estado === 'cancelado_tarde').length;
  modal(`<h2>${fechaLarga(p.fecha)} · ${esc(p.hora)}</h2>
    <p class="mute">${p.estado === 'cerrado' ? '✅ Cerrado' : '🚫 Suspendido'} · ${n} jugadores · ${money(p.precio)} c/u</p>
    ${campoDatos('t_datos', p.datosTransferencia)}
    <button class="btn pri full big" style="margin-top:14px" onclick="act('transferenciaPartido',{id:'${pid}',datosTransferencia:val('t_datos')})">Guardar datos para transferir</button>
    <p class="small mute center">Un partido ${p.estado} ya no cambia de fecha, precio ni jugadores; los datos para transferir sí.</p>`);
};
A.cerrar = pid => {
  const p = partidoById(pid);
  const orden = { titular: 0, cancelado_tarde: 1, espera: 2, cancelado: 3 };
  const L = insOf(pid).sort((a, b) => orden[a.estado] - orden[b.estado]);
  const lbl = { titular: 'Jugó (o no vino sin avisar)', cancelado_tarde: 'Canceló el mismo día', espera: 'Quedó en lista de espera', cancelado: 'Canceló con anticipación' };
  modal(`<h2>Cerrar partido</h2><p class="mute">Los anotados ya tienen cargado <b>${money(p.precio)}</b>. Marca quiénes pagan: vienen marcados los titulares
    y los que cancelaron el mismo día. <b>Si desmarcas a alguien, se le anula el cobro.</b></p>
    <div class="list" style="padding:0">${L.map(i => `<label class="li" style="margin:0;color:var(--ink);font-weight:400"><input type="checkbox" class="cb" value="${i.jugadorId}" ${i.estado === 'titular' || i.estado === 'cancelado_tarde' ? 'checked' : ''} onchange="A.totCierre(${p.precio},${p.costoTotal || 0})">
      <div class="grow"><div class="t">${esc(i.nombre)}</div><div class="small mute">${lbl[i.estado]}</div></div></label>`).join('')}</div>
    <p id="c_tot" class="center"></p>
    <button class="btn pri full big" onclick="act('cerrarPartido',{id:'${pid}',cobrar:[...document.querySelectorAll('.cb:checked')].map(e=>e.value)})">Confirmar cierre</button>
    <p class="small mute center">Esto no se puede deshacer, pero puedes anular cargos individuales desde la ficha del jugador.</p>`);
  A.totCierre(p.precio, p.costoTotal);
};
A.totCierre = (precio, costo) => {
  const n = document.querySelectorAll('.cb:checked').length;
  document.getElementById('c_tot').innerHTML = `Pagan ${n} jugador${n === 1 ? '' : 'es'}:<br>${cuentaCancha(n, precio, costo || 0)}`;
};
A.suspender = async pid => { if (await ask('¿Suspender partido?', 'Se anula el cobro de todos los anotados y desaparece de los partidos abiertos.', 'Suspender', true)) act('suspenderPartido', { id: pid }); };

/* ---------- ajustes ---------- */

      <div class="grid2"><label>Cupo por partido<input id="s_cupo" type="text" inputmode="numeric" value="${c.cupo}"></label>
        <label>Hora habitual<input id="s_hora" type="time" value="${esc(c.hora)}"></label></div>
      <label>Lugar habitual<input id="s_lugar" maxlength="80" value="${esc(c.lugar)}"></label>
      <label>Datos para transferir <span class="small">(se copian a cada partido nuevo; en cada partido se pueden cambiar)</span><textarea id="s_datos" rows="5" maxlength="500" placeholder="Banco, tipo y número de cuenta, RUT, nombre, correo">${esc(c.datosTransferencia)}</textarea></label>
      <button class="btn pri full" style="margin-top:14px" onclick="A.guardarConfig()">Guardar</button></div>`;
}
A.hintConfig = () => {
  const h = document.getElementById('s_hint'); if (!h) return;
  const cfg = { dividirEntre: entero(val('s_div')) || 1, redondeo: entero(val('s_red')) || 1 }, costo = entero(val('s_costo'));
  const precio = precioDe(costo, cfg);
  h.innerHTML = `Precio por jugador: <b>${money(precio)}</b><br>Si juegan ${cfg.dividirEntre}: ${cuentaCancha(cfg.dividirEntre, precio, costo)}`;
};
A.guardarConfig = () => act('guardarConfig', { config: {
  nombreGrupo: val('s_nombre'), codigoGrupo: val('s_cod'), costoCancha: val('s_costo'), dividirEntre: val('s_div'), redondeo: val('s_red'),
  cupo: val('s_cupo'), hora: val('s_hora'), lugar: val('s_lugar'), datosTransferencia: document.getElementById('s_datos').value
} });

/* =====================================================================
 *  Arranque
 * ===================================================================== */
function loadScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); });
}
// Chrome avisa que la app se puede instalar → mostramos nuestro botón "Instalar".
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!$('#modal').classList.contains('on')) render(); });
addEventListener('appinstalled', () => { installEvt = null; toast('App instalada ✅'); render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.token && Date.now() - S.lastLoad > 20000 && !$('#modal').classList.contains('on')) load(true);
});
(async function start() {
  if ('serviceWorker' in navigator && /^https:|localhost/.test(location.href)) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (DEMO) {
    try { await loadScript('demo.js'); await loadScript('backend.js'); }
    catch (e) { $('#app').innerHTML = `<div class="splash">${esc(e.message)}</div>`; return; }
    const q = new URLSearchParams(location.search);
    if (q.get('as')) {
      const adm = q.get('as') === 'admin';
      try { const r = await call('login', { nombre: adm ? 'Jonathan' : 'Jugador Demo', telefono: adm ? '911111111' : '922222222' }); setToken(r.token); } catch (e) { }
    }
    if (q.get('pal')) PAL = aplicarPaleta(q.get('pal'));   // vista previa de una paleta (no se guarda)
    if (q.get('tab')) S.tab = q.get('tab');
    if (q.get('adm')) S.adm = q.get('adm');
  }
  await load();
})();
</script>
</body>
